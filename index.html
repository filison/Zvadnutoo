<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zvládnu to – Přihlášení</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f3f9fa;
    }
    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      max-width: 300px;
    }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    .form-container {
      display: none;
    }
    .form-container.active {
      display: block;
    }
    a {
      color: #007bff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Zvládnu to</h1>
  <p>Chytrý pomocník pro zvládání finanční nejistoty a stresu.</p>

  <!-- Přihlašovací formulář -->
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="E-mail" required>
    <input type="password" id="loginPassword" placeholder="Heslo" required>
    <button type="submit">Přihlásit se</button>
    <p>Nemáš účet? <a href="#" id="showRegister">Zaregistruj se</a></p>
  </form>

  <!-- Registrační formulář (skrytý) -->
  <form id="registerForm" style="display:none;">
    <input type="email" id="registerEmail" placeholder="Email" required>
    <input type="password" id="registerPassword" placeholder="Heslo" required>
    <button type="submit">Registrovat</button>
    <p>Už máš účet? <a href="#" id="showLogin">Přihlas se</a></p>
  </form>

  <!-- JavaScript -->
  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const showRegister = document.getElementById('showRegister');
    const showLogin = document.getElementById('showLogin');

    showRegister.addEventListener('click', function(e) {
      e.preventDefault();
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
    });

    showLogin.addEventListener('click', function(e) {
      e.preventDefault();
      registerForm.style.display = 'none';
      loginForm.style.display = 'block';
    });
  </script>
</body>

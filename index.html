<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zvládnu to</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Zvládnu to</h1>
    <p class="subtitle">Chytrý pomocník pro zvládání finanční nejistoty a stresu.</p>

    <div class="form-wrapper">
      <form id="loginForm">
        <input type="email" placeholder="E-mail" required />
        <input type="password" placeholder="Heslo" required />
        <button type="submit">Přihlásit se</button>
        <p>Nemáš účet? <a href="#" onclick="toggleForms()">Zaregistruj se</a></p>
      </form>

      <form id="registerForm" style="display: none;">
        <input type="text" placeholder="Jméno" required />
        <input type="email" placeholder="E-mail" required />
        <input type="password" placeholder="Heslo" required />
        <button type="submit">Zaregistrovat se</button>
        <p>Máš už účet? <a href="#" onclick="toggleForms()">Přihlásit se</a></p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

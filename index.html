<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zvládnu to – Přihlášení</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #eff8f9;
      padding: 20px;
      text-align: center;
    }
    input, button {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      max-width: 300px;
    }
    #registerForm {
      display: none;
    }
    a {
      cursor: pointer;
      color: blue;
    }
  </style>
</head>
<body>

  <h1>Zvládnu to</h1>
  <p>Chytrý pomocník pro zvládání finanční nejistoty a stresu.</p>

  <!-- Přihlašovací formulář -->
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="E-mail" required />
    <input type="password" id="loginPassword" placeholder="Heslo" required />
    <button type="submit">Přihlásit se</button>
  </form>

  <p>Nemáš účet? <a id="toggleRegister">Zaregistruj se</a></p>

  <!-- Registrační formulář -->
  <form id="registerForm">
    <input type="email" id="registerEmail" placeholder="E-mail" required />
    <input type="password" id="registerPassword" placeholder="Heslo" required />
    <button type="submit">Registrovat</button>
  </form>

  <!-- Firebase + vlastní JS -->
  <script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    // Firebase konfigurace
    const firebaseConfig = {
      apiKey: "AIzaSyAcg0qqzWJwkxmopkTgzfasMqd3siQN72Mc",
      authDomain: "zvladnuto-4e6cb.firebaseapp.com",
      projectId: "zvladnuto-4e6cb",
      storageBucket: "zvladnuto-4e6cb.appspot.com",
      messagingSenderId: "299881468872",
      appId: "1:299881468872:web:8c36e215cf40a9174884ec",
      measurementId: "G-HZZG7JRYCC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Přihlášení
    const loginForm = document.getElementById("loginForm");
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Přihlášení úspěšné!");
        })
        .catch((error) => {
          alert("Chyba při přihlášení: " + error.message);
        });
    });

    // Registrace
    const registerForm = document.getElementById("registerForm");
    registerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;
      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Registrace byla úspěšná!");
        })
        .catch((error) => {
          alert("Chyba při registraci: " + error.message);
        });
    });

    // Přepínání formulářů
    document.getElementById("toggleRegister").addEventListener("click", () => {
      document.getElementById("registerForm").style.display = "block";
      document.getElementById("loginForm").style.display = "none";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Zvládnu to – Přihlášení a Registrace</title>
  <style>
    body {
      background-color: #f4f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #43a047;
    }

    .toggle-link {
      margin-top: 15px;
      font-size: 14px;
      color: #3498db;
      cursor: pointer;
      display: inline-block;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #e74c3c;
    }

    .hidden {
      display: none;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcg0qqzWJwkxmopkTgzfasMqd3siQNxIU",
      authDomain: "zvladnuto-4e6cb.firebaseapp.com",
      projectId: "zvladnuto-4e6cb",
      storageBucket: "zvladnuto-4e6cb.appspot.com",
      messagingSenderId: "299881468872",
      appId: "1:299881468872:web:8c36e215cf40a91748e6fd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.toggleForm = function(type) {
      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      const message = document.getElementById("message");

      message.textContent = "";
      if (type === 'login') {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
      } else {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
      }
    };

    window.register = async () => {
      const email = document.getElementById("register-email").value;
      const password = document.getElementById("register-password").value;
      const messageEl = document.getElementById("message");

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        messageEl.style.color = "green";
        messageEl.textContent = "Registrace proběhla úspěšně!";
      } catch (error) {
        messageEl.style.color = "red";
        messageEl.textContent = "Chyba: " + error.message;
      }
    };

    window.login = async () => {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const messageEl = document.getElementById("message");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        messageEl.style.color = "green";
        messageEl.textContent = "Přihlášení proběhlo úspěšně!";
      } catch (error) {
        messageEl.style.color = "red";
        messageEl.textContent = "Chyba: " + error.message;
      }
    };
  </script>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Zvládnu to – Přihlášení</h2>

    <!-- Přihlášení -->
    <div id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Heslo" required>
      <button onclick="login()">Přihlásit se</button>
      <div class="toggle-link" onclick="toggleForm('register')">Nemáš účet? Zaregistruj se</div>
    </div>

    <!-- Registrace -->
    <div id="register-form" class="hidden">
      <input type="email" id="register-email" placeholder="Email" required>
      <input type="password" id="register-password" placeholder="Heslo" required>
      <button onclick="register()">Registrovat se</button>
      <div class="toggle-link" onclick="toggleForm('login')">Už máš účet? Přihlas se</div>
    </div>

    <div class="message" id="message"></div>
  </div>
</body>
</html>
